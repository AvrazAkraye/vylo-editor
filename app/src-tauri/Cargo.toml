[package]
name = "vylo-editor"
version = "0.17.0"
description = "AI coding agent for macOS and Windows"
edition = "2021"

[lib]
name = "vylo_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
base64 = "0.22"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
portable-pty = "0.9.0"
sha2 = "0.11.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

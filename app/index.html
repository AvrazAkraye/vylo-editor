<!doctype html>
<!-- `dir` beside `lang` so the first paint, before any script runs, is not
     directionless. `src/rtl.ts` replaces both from the stored language in
     `main.tsx`, still before React's first render. -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vylo Editor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Build desktop apps

# Windows cannot be built from a Mac -- Tauri needs the target's own toolchain
# and WebView2 headers -- so CI is not a nicety here, it is the only way the
# Windows .exe gets produced at all.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Keyed on the lockfile and target so a dependency bump busts it, but a
      # source-only change does not.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck and test the frontend
        working-directory: app
        run: |
          npm run build
          npm test

      - name: Test the Rust tool layer
        working-directory: app/src-tauri
        run: cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without these an update is produced but
          # fails verification on every machine it reaches -- which is worse
          # than no update, because it looks like the app is broken.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: --target ${{ matrix.target }}
          # A tag build publishes a draft release; a manual run just uploads
          # artifacts, so the button is safe to press whenever.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Vylo Editor {0}', github.ref_name) || '' }}
          releaseDraft: true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: vylo-editor-${{ matrix.target }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            app/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
            app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.nsis.zip*
            app/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.zip*
